name: Build Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Initialize Beat Saber References
      uses: beat-forge/init-beatsaber@v1
      with:
        manifest: 'MultiplayerAvatars/manifest.json'

    - name: Download SiraUtil & CustomAvatar
      run: |
        mkdir -p Refs/Plugins
        mkdir -p temp_deps

        echo "Downloading SiraUtil..."
        curl -sSL "https://github.com/Auros/SiraUtil/releases/download/v3.4.0/SiraUtil-v3.4.0+bs.1.42.0.zip" -o temp_deps/SiraUtil.zip
        unzip -q -o temp_deps/SiraUtil.zip -d temp_deps/sira/

        echo "Downloading CustomAvatar..."
        curl -sSL "https://github.com/nicoco007/BeatSaberCustomAvatars/releases/download/v5.4.10/CustomAvatar-v5.4.10+bs.1.40.0.zip" -o temp_deps/CustomAvatar.zip
        unzip -q -o temp_deps/CustomAvatar.zip -d temp_deps/ca/

        find temp_deps/ -name "SiraUtil.dll" -exec cp {} Refs/ \;
        find temp_deps/ -name "SiraUtil.dll" -exec cp {} Refs/Plugins/ \;

        find temp_deps/ -name "CustomAvatar.dll" -exec cp {} Refs/ \;
        find temp_deps/ -name "CustomAvatar.dll" -exec cp {} Refs/Plugins/ \;

    - name: Clone and Build MultiplayerCore From Source
      run: |
        git clone --depth 1 https://github.com/Goobwabber/MultiplayerCore.git temp_mpcore
        dotnet build temp_mpcore/MultiplayerCore/MultiplayerCore.csproj -c Release
        
        # Copy the freshly compiled MultiplayerCore.dll into place
        find temp_mpcore/ -name "MultiplayerCore.dll" -path "*/bin/Release/*" -exec cp {} Refs/ \;
        find temp_mpcore/ -name "MultiplayerCore.dll" -path "*/bin/Release/*" -exec cp {} Refs/Plugins/ \;

    - name: Verify All DLL Sizes in Refs
      run: |
        ls -lh Refs/
        ls -lh Refs/Plugins/

    - name: Build Solution
      run: dotnet build MultiplayerAvatars.sln -c Release