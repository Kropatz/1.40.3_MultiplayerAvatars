name: Build Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Initialize Beat Saber References
      uses: beat-forge/init-beatsaber@v1
      with:
        manifest: 'MultiplayerAvatars/manifest.json'

    - name: Download Missing Mod Dependencies
      run: |
        mkdir -p Refs/Plugins
        # Download SiraUtil, MultiplayerCore, and CustomAvatar release DLLs for 1.40 compatibility
        curl -L -o Refs/Plugins/SiraUtil.dll https://github.com/Auros/SiraUtil/releases/download/v3.4.0/SiraUtil.dll
        curl -L -o Refs/Plugins/MultiplayerCore.dll https://github.com/Goobwabber/MultiplayerCore/releases/download/v1.1.2/MultiplayerCore.dll
        curl -L -o Refs/Plugins/CustomAvatar.dll https://github.com/nicoco007/BeatSaberCustomAvatars/releases/download/v5.4.13/CustomAvatar.dll

    - name: Build Solution
      run: dotnet build MultiplayerAvatars.sln -c Release