name: Build Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Initialize Beat Saber References
        uses: beat-forge/init-beatsaber@v1
        with:
          manifest: 'MultiplayerAvatars/manifest.json'

      - name: Download Dependencies and Refs
        run: |
          mkdir -p Refs/Plugins
          mkdir -p temp_deps
          
          echo "Downloading SiraUtil..."
          curl -sSL "https://github.com/Auros/SiraUtil/releases/download/v3.4.0/SiraUtil-v3.4.0+bs.1.42.0.zip" -o temp_deps/SiraUtil.zip
          unzip -q -o temp_deps/SiraUtil.zip -d temp_deps/sira/
          
          echo "Downloading CustomAvatar..."
          curl -sSL "https://github.com/nicoco007/BeatSaberCustomAvatars/releases/download/v5.4.10/CustomAvatar-v5.4.10+bs.1.40.0.zip" -o temp_deps/CustomAvatar.zip
          unzip -q -o temp_deps/CustomAvatar.zip -d temp_deps/ca/

          echo "Downloading SongCore..."
          curl -sSL "https://github.com/Kylemc1413/SongCore/releases/download/v3.10.4/SongCore-3.10.4-bs1.31.0-fbb0684.zip" -o temp_deps/SongCore.zip
          unzip -q -o temp_deps/SongCore.zip -d temp_deps/songcore/

          echo "Downloading BeatSaberMarkupLanguage..."
          curl -sSL "https://github.com/monkeymanboy/BeatSaberMarkupLanguage/releases/download/v1.14.2/BeatSaberMarkupLanguage-v1.14.2+bs.1.41.1-RELEASE.zip" -o temp_deps/BSML.zip
          unzip -q -o temp_deps/BSML.zip -d temp_deps/bsml/

          echo "Downloading BeatSaverSharp..."
          curl -sSL "https://github.com/Auros/BeatSaverSharper/releases/download/v3.4.5/BeatSaverSharper-Beat.Saber.zip" -o temp_deps/BeatSaverSharp.zip
          unzip -q -o temp_deps/BeatSaverSharp.zip -d temp_deps/bss/
          
          # Automatically copy all DLL files from all downloaded dependencies into Refs and Refs/Plugins
          find temp_deps/ -name "*.dll" -exec cp {} Refs/ \;
          find temp_deps/ -name "*.dll" -exec cp {} Refs/Plugins/ \;
          
          # Clean up temp files
          rm -rf temp_deps

      - name: Clone and Build MultiplayerCore From Source
        run: |
          ROOT_DIR=$(pwd)
          git clone --depth 1 https://github.com/Goobwabber/MultiplayerCore.git temp_mpcore
          dotnet build temp_mpcore/MultiplayerCore/MultiplayerCore.csproj -c Release /p:BeatSaberDir="$ROOT_DIR/Refs"
          
          # Copy the freshly compiled MultiplayerCore.dll into place
          find temp_mpcore/ -name "MultiplayerCore.dll" -path "*/bin/Release/*" -exec cp {} Refs/ \;
          find temp_mpcore/ -name "MultiplayerCore.dll" -path "*/bin/Release/*" -exec cp {} Refs/Plugins/ \;
          
          # Clean up temp mpcore folder
          rm -rf temp_mpcore

      - name: Verify All DLL Sizes in Refs
        run: |
          ls -lh Refs/
          ls -lh Refs/Plugins/

      - name: Build Solution
        run: |
          ROOT_DIR=$(pwd)
          dotnet build MultiplayerAvatars.sln -c Release /p:BeatSaberDir="$ROOT_DIR/Refs"