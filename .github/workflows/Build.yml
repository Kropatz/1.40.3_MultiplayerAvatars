name: Build Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Initialize Beat Saber References
      uses: beat-forge/init-beatsaber@v1
      with:
        manifest: 'MultiplayerAvatars/manifest.json'

    - name: Download Mod Dependencies
      run: |
        mkdir -p Refs/Plugins
        mkdir -p temp_deps

        echo "Downloading SiraUtil.dll..."
        curl -sL "https://github.com/Auros/SiraUtil/releases/download/v3.4.0/SiraUtil.dll" -o Refs/SiraUtil.dll
        cp Refs/SiraUtil.dll Refs/Plugins/SiraUtil.dll

        echo "Downloading MultiplayerCore.dll..."
        curl -sL "https://github.com/Goobwabber/MultiplayerCore/releases/download/1.5.2/MultiplayerCore.dll" -o Refs/MultiplayerCore.dll
        cp Refs/MultiplayerCore.dll Refs/Plugins/MultiplayerCore.dll

        echo "Downloading CustomAvatar zip..."
        curl -sL "https://github.com/nicoco007/BeatSaberCustomAvatars/releases/download/v5.4.10/CustomAvatar-v5.4.10+bs.1.40.0.zip" -o temp_deps/CustomAvatar.zip
        unzip -q temp_deps/CustomAvatar.zip -d temp_deps/ca_extracted/
        find temp_deps/ -name "CustomAvatar.dll" -exec cp {} Refs/ \;
        find temp_deps/ -name "CustomAvatar.dll" -exec cp {} Refs/Plugins/ \;

        echo "Verifying all downloaded DLL sizes in Refs:"
        ls -lh Refs/

    - name: Build Solution
      run: dotnet build MultiplayerAvatars.sln -c Release