name: Build Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Initialize Beat Saber References
      uses: beat-forge/init-beatsaber@v1
      with:
        manifest: 'MultiplayerAvatars/manifest.json'

    - name: Download Missing Mod Dependencies
      run: |
        mkdir -p Refs/Plugins
        echo "Downloading SiraUtil..."
        curl -L -o Refs/Plugins/SiraUtil.dll https://github.com/Auros/SiraUtil/releases/latest/download/SiraUtil.dll
        echo "Downloading MultiplayerCore..."
        curl -L -o Refs/Plugins/MultiplayerCore.dll https://github.com/Goobwabber/MultiplayerCore/releases/latest/download/MultiplayerCore.dll
        echo "Downloading CustomAvatar..."
        curl -L -o Refs/Plugins/CustomAvatar.dll https://github.com/nicoco007/BeatSaberCustomAvatars/releases/latest/download/CustomAvatar.dll
        
        echo "Verifying downloaded file sizes..."
        ls -lh Refs/Plugins/

    - name: Build Solution
      run: dotnet build MultiplayerAvatars.sln -c Release