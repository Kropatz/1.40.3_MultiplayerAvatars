name: Build Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Initialize Beat Saber References
      uses: beat-forge/init-beatsaber@v1
      with:
        manifest: 'MultiplayerAvatars/manifest.json'

    - name: Download & Extract Mod Dependencies
      run: |
        mkdir -p Refs/Plugins
        mkdir -p temp_deps

        echo "Downloading SiraUtil..."
        curl -sSL "https://github.com/Auros/SiraUtil/releases/download/v3.4.0/SiraUtil-v3.4.0+bs.1.42.0.zip" -o temp_deps/SiraUtil.zip
        unzip -q -o temp_deps/SiraUtil.zip -d temp_deps/sira/

        echo "Downloading MultiplayerCore..."
        curl -sSL "https://github.com/Goobwabber/MultiplayerCore/releases/latest/download/MultiplayerCore.zip" -o temp_deps/MultiplayerCore.zip || curl -sSL "https://github.com/Goobwabber/MultiplayerCore/releases/download/v1.5.2/MultiplayerCore.zip" -o temp_deps/MultiplayerCore.zip || true
        unzip -q -o temp_deps/MultiplayerCore.zip -d temp_deps/mpcore/ || true

        echo "Downloading CustomAvatar..."
        curl -sSL "https://github.com/nicoco007/BeatSaberCustomAvatars/releases/download/v5.4.10/CustomAvatar-v5.4.10+bs.1.40.0.zip" -o temp_deps/CustomAvatar.zip
        unzip -q -o temp_deps/CustomAvatar.zip -d temp_deps/ca/

        echo "Distributing extracted DLLs..."
        find temp_deps/ -name "SiraUtil.dll" -exec cp {} Refs/ \;
        find temp_deps/ -name "SiraUtil.dll" -exec cp {} Refs/Plugins/ \;

        find temp_deps/ -name "MultiplayerCore.dll" -exec cp {} Refs/ \;
        find temp_deps/ -name "MultiplayerCore.dll" -exec cp {} Refs/Plugins/ \;

        find temp_deps/ -name "CustomAvatar.dll" -exec cp {} Refs/ \;
        find temp_deps/ -name "CustomAvatar.dll" -exec cp {} Refs/Plugins/ \;

        echo "Verifying all downloaded DLL sizes in Refs:"
        ls -lh Refs/
        ls -lh Refs/Plugins/

    - name: Build Solution
      run: dotnet build MultiplayerAvatars.sln -c Release