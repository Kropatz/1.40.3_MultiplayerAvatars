name: Build Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Initialize Beat Saber References
      uses: beat-forge/init-beatsaber@v1
      with:
        manifest: 'MultiplayerAvatars/manifest.json'

    - name: Build Solution
      run: dotnet build MultiplayerAvatars.sln -c Release